{% load static %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}Harbor Market</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{% static 'store/app.css' %}">
    <script src="{% static 'store/app.js' %}" defer></script>
  </head>
  <body class="flex min-h-screen flex-col bg-stone-50 text-stone-900 antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-white focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:shadow">Skip to content</a>
    {% include "store/includes/header.html" %}
    <main id="main" class="flex-1">
      {% block content %}{% endblock %}
    </main>
    {% include "store/includes/footer.html" %}
  </body>
</html>
