{% with palette=product.palette %}
<div class="relative aspect-square overflow-hidden rounded-2xl {{ palette.tile }}">
  <div class="absolute left-1/2 top-1/2 aspect-square w-2/5 -translate-x-1/2 -translate-y-1/2 rotate-6 rounded-[28%] shadow-xl transition group-hover:rotate-12 {{ palette.accent }}"></div>
  {% if product.is_sold_out or product.on_sale %}
  <div class="absolute left-3 top-3 flex gap-1.5">
    {% if product.is_sold_out %}<span class="rounded-full bg-stone-900 px-2.5 py-1 text-xs font-medium text-white">Sold out</span>{% endif %}
    {% if product.on_sale %}<span class="rounded-full bg-rose-600 px-2.5 py-1 text-xs font-medium text-white">Sale</span>{% endif %}
  </div>
  {% endif %}
</div>
{% endwith %}
