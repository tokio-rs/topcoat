<div class="bg-teal-900 px-4 py-2 text-center text-xs font-medium text-teal-50 sm:text-sm">Free shipping on orders over $75 and free 30-day returns</div>
<header class="sticky top-0 z-20 border-b border-stone-200 bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-10 gap-y-3 px-4 py-3 sm:px-6 lg:px-8">
    <a href="{% url 'store:home' %}" class="flex items-center gap-2.5 text-lg font-semibold tracking-tight text-stone-900">{% include "store/icons/logo.svg" %}Harbor Market</a>
    <nav id="site-nav" aria-label="Main" class="order-last hidden w-full md:order-none md:block md:w-auto">
      <ul class="flex flex-col gap-1 border-t border-stone-100 pt-3 md:flex-row md:gap-8 md:border-0 md:pt-0">
        <li><a href="{% url 'store:listing' %}" class="block rounded-md px-2 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900 md:p-0 md:hover:bg-transparent">All products</a></li>
        <li><a href="{% url 'store:listing' %}?category=outdoor" class="block rounded-md px-2 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900 md:p-0 md:hover:bg-transparent">Outdoor</a></li>
        <li><a href="{% url 'store:listing' %}?category=kitchen" class="block rounded-md px-2 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900 md:p-0 md:hover:bg-transparent">Kitchen</a></li>
        <li><a href="{% url 'store:listing' %}?category=electronics" class="block rounded-md px-2 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900 md:p-0 md:hover:bg-transparent">Electronics</a></li>
        <li><a href="{% url 'store:about' %}" class="block rounded-md px-2 py-2 text-sm font-medium text-stone-600 hover:bg-stone-100 hover:text-stone-900 md:p-0 md:hover:bg-transparent">About</a></li>
      </ul>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <div class="flex items-center gap-2 rounded-full border border-stone-200 bg-white py-1.5 pl-3 pr-1.5 text-sm font-medium text-stone-700">
        {% include "store/icons/bag.svg" %}
        <span class="hidden sm:inline">Cart</span>
        <span data-cart-count class="min-w-6 rounded-full bg-teal-700 px-2 py-0.5 text-center text-xs font-semibold text-white">{{ cart_badge }}</span>
      </div>
      <button type="button" data-menu-toggle aria-controls="site-nav" aria-expanded="false" class="rounded-md p-2 text-stone-600 hover:bg-stone-100 md:hidden">
        <span class="sr-only">Toggle menu</span>
        {% include "store/icons/menu.svg" %}
      </button>
    </div>
  </div>
</header>
