{% extends "store/base.html" %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-24 text-center sm:py-32">
  <p class="text-sm font-semibold text-teal-700">{% block status %}{% endblock %}</p>
  <h1 class="mt-3 text-4xl font-semibold tracking-tight text-stone-900">{% block heading %}{% endblock %}</h1>
  <p class="mt-4 text-stone-600">{% block message %}{% endblock %}</p>
  <div class="mt-10 flex flex-wrap justify-center gap-4">
    <a href="{% url 'store:home' %}" class="rounded-full bg-teal-700 px-6 py-3 text-sm font-semibold text-white hover:bg-teal-800">Back to home</a>
    <a href="{% url 'store:listing' %}" class="rounded-full px-6 py-3 text-sm font-semibold text-stone-700 ring-1 ring-inset ring-stone-300 hover:bg-stone-100">Browse products</a>
  </div>
</div>
{% endblock %}
