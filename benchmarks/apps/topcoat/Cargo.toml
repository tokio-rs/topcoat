[package]
name = "harbor-topcoat"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
time = { workspace = true, features = ["formatting", "macros", "parsing", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
topcoat.workspace = true

# Only this benchmark app selects a global allocator, so these are not workspace dependencies.
mimalloc = { version = "0.1.52", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }

[build-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
topcoat = { path = "../../../crates/topcoat", default-features = false, features = ["tailwind"] }

[lints]
workspace = true
