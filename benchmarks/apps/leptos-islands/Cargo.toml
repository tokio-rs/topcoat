[package]
name = "harbor-leptos-islands"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8.9", features = ["macros"], optional = true }
axum-extra = { version = "0.12.6", features = ["cookie"], optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
leptos = { version = "0.8.23", features = ["islands"] }
leptos_axum = { version = "0.8.10", optional = true }
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["macros", "parsing", "formatting", "serde"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"], optional = true }
tower-http = { version = "0.7.1", features = ["compression-full"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
web-sys = { version = "0.3", features = ["DomTokenList", "Element", "HtmlDocument", "Node", "NodeList"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.52", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum",
    "dep:axum-extra",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:tower-http",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[lints.rust]
unsafe_code = "forbid"

# Same as the `benchmark` profile of the Topcoat workspace, so every Rust app is built the same way.
# cargo-leptos builds the server with it (`bin-profile-release`).
[profile.benchmark]
inherits = "release"
codegen-units = 1
lto = "fat"

# The size-optimized profile for the WebAssembly bundle recommended by the Leptos book
# (https://book.leptos.dev/deployment/binary_size.html), used through `lib-profile-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "harbor-leptos-islands"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "style/tailwind.css"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
bin-profile-release = "benchmark"
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

# Standalone on purpose: this app has its own dependency tree and lockfile.
[workspace]
