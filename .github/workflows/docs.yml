name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - book.toml
      - .github/scripts/rustdoc_links.py
      - .github/workflows/docs.yml
  # Manual re-deploy of main, for when a deploy failed or the Pages settings
  # changed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploy one build at a time. Let a running deploy finish instead of cancelling
# it halfway through; a newer push waits and then replaces it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: github.repository == 'tokio-rs/topcoat'
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      # The guides link to API items the way rustdoc expects. The
      # `rustdoc-links` preprocessor reads the resolved links from these docs.
      - run: cargo doc -p topcoat --all-features --no-deps --locked
      # Reads `book.toml` and writes the site to `book/`.
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book

  # Needs Settings -> Pages -> Source set to "GitHub Actions".
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
