[package]
name = "topcoat-inertia"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
asset = ["dep:topcoat-asset", "dep:sha2"]

[dependencies]
topcoat-asset = { workspace = true, optional = true }
topcoat-cookie.workspace = true
topcoat-core.workspace = true
topcoat-router.workspace = true
topcoat-view.workspace = true

base64.workspace = true
http.workspace = true
http-body.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
web-time.workspace = true

[dev-dependencies]
topcoat = { workspace = true, features = ["inertia"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["topcoat"]
