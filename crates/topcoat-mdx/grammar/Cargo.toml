[package]
name = "topcoat-mdx-grammar"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = false

[dependencies]
# markdown-rs types (to_mdast, mdast::Node) cross the boundary to
# topcoat-mdx-macro, so both crates must resolve the same version. The
# workspace entry is what keeps them together.
markdown.workspace = true
topcoat-view-grammar.workspace = true

heck = { workspace = true }
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
