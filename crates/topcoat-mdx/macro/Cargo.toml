[package]
name = "topcoat-mdx-macro"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[features]
discover = []
# Mirrors topcoat-mdx's feature of the same name, which turns it on. The macro
# only reads it to tell an author that `frontmatter = Type` needs the runtime
# support enabled, rather than letting the generated code fail on a missing
# module.
frontmatter = []

[dependencies]
# markdown-rs types (to_mdast, mdast::Node) cross the boundary to
# topcoat-mdx-grammar, so both crates must resolve the same version. The
# workspace entry is what keeps them together.
markdown.workspace = true
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
topcoat-core-grammar.workspace = true

proc-macro2.workspace = true
quote.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde-value.workspace = true
toml.workspace = true
heck = { workspace = true }
ignore = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
topcoat = { workspace = true, features = ["mdx", "mdx-frontmatter", "view"] }
topcoat-mdx-grammar.workspace = true
topcoat-view-grammar.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
markdown.workspace = true
# Tests deserialize the same frontmatter the macro does, so they need the same
# parsers rather than a second copy of them.
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
toml.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
