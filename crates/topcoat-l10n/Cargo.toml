[package]
name = "topcoat-l10n"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Checks the messages of a compiled binary against its Fluent files.
check = [
	"dep:fluent-syntax",
	"dep:memchr",
	"dep:strsim",
	"fluent",
]
fluent = [
	"dep:fixed_decimal",
	"dep:fluent-bundle",
	"dep:icu_decimal",
	"dep:icu_provider",
	"dep:intl-memoizer",
	"dep:inventory",
	"dep:unic-langid",
	"http",
]
http = [
	"dep:http",
]
serde = [
	"dep:serde",
]
view = [
	"dep:topcoat-view",
]

[dependencies]
topcoat-core.workspace = true
topcoat-view = { workspace = true, optional = true }

fixed_decimal = { workspace = true, optional = true, features = ["ryu"] }
fluent-bundle = { workspace = true, optional = true }
fluent-syntax = { workspace = true, optional = true }
http = { workspace = true, optional = true }
icu_decimal = { workspace = true, optional = true, features = ["alloc"] }
icu_locale.workspace = true
icu_locale_core = { workspace = true, features = ["alloc"] }
icu_provider = { workspace = true, optional = true, features = ["sync"] }
intl-memoizer = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
strsim = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }

[dev-dependencies]
http.workspace = true
topcoat = { workspace = true, features = ["l10n-fluent", "view"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["topcoat"]
