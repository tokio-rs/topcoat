[package]
name = "topcoat-metadata"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
asset = [
	"dep:topcoat-asset",
]
l10n = [
	"dep:topcoat-l10n",
	"topcoat-l10n/fluent",
]
router = [
	"dep:topcoat-router",
]
view = [
	"dep:topcoat-view",
	"dep:topcoat-view-macro",
	"topcoat-asset?/view",
]

[dependencies]
topcoat-asset = { workspace = true, optional = true }
topcoat-core.workspace = true
topcoat-core-macro.workspace = true
topcoat-l10n = { workspace = true, optional = true }
topcoat-router = { workspace = true, optional = true }
topcoat-view = { workspace = true, optional = true }
topcoat-view-macro = { workspace = true, optional = true }

[dev-dependencies]
topcoat = { workspace = true, features = ["metadata"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-udeps.ignore]
development = ["topcoat"]
