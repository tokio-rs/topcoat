[package]
name = "topcoat-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
discover = ["dep:inventory"]
router = [
	"dep:topcoat-router",
]
websocket = [
	"router",
	"topcoat-router/websocket",
	"dep:futures-core",
	"dep:futures-util",
	"dep:tokio",
]

[dependencies]
topcoat-asset.workspace = true
topcoat-core.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-view.workspace = true

futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true, features = ["sink"] }
inventory = { workspace = true, optional = true }
ref-cast.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# On wasm32-unknown-unknown the runtime's random IDs need the JS host
# (`crypto.getRandomValues`) as their source of randomness.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["v4", "serde", "js"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
