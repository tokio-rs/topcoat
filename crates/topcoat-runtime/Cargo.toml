[package]
name = "topcoat-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:futures-util",
	"dep:tokio",
	"dep:topcoat-router",
	"topcoat-router/websocket",
]

[dependencies]
topcoat-asset.workspace = true
topcoat-core.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-view.workspace = true

futures-util = { workspace = true, optional = true }
ref-cast.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }

[dev-dependencies]
# We cannot use `workspace = true` with `default-features = false`.
topcoat = { path = "../topcoat", default-features = false, features = ["view"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
