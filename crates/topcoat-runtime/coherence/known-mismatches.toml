[[mismatch]]
id = "captured_nan"
reason = "A captured nonfinite float serializes as null and hydrates as unit."
rust = { kind = "Return", value = { type = "F64", value = "nan" } }
javascript = { kind = "Return", value = { type = "Unit" } }

[[mismatch]]
id = "captured_infinity"
reason = "A captured nonfinite float serializes as null and hydrates as unit."
rust = { kind = "Return", value = { type = "F64", value = "7ff0000000000000" } }
javascript = { kind = "Return", value = { type = "Unit" } }

[[mismatch]]
id = "some_unit"
reason = "The JavaScript option uses undefined for both None and a unit payload."
rust = { kind = "Return", value = { type = "Bool", value = true } }
javascript = { kind = "Return", value = { type = "Bool", value = false } }

# Fixture for harness tests of compile-error baselines, not a product mismatch.
[[mismatch]]
id = "illegal_break_statement"
reason = "A compiled JavaScript break outside a loop is a SyntaxError."
rust = { kind = "Return", value = { type = "F64", value = "4008000000000000" } }
javascript = { kind = "CompileError", value = "SyntaxError: Illegal break statement" }
