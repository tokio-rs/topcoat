[[mismatch]]
id = "captured_tuple_field"
reason = "Captured tuples serialize as arrays, which JavaScript hydration does not recognize."
rust = { kind = "Return", value = { type = "F64", value = "3ff8000000000000" } }
javascript = { kind = "Exception", value = "Error: Unknown surrogate type: undefined" }

[[mismatch]]
id = "captured_tuple_value"
reason = "Returning a captured tuple fails during JavaScript hydration before it can be observed."
rust = { kind = "Return", value = { type = "Tuple", value = [{ type = "F64", value = "3ff8000000000000" }, { type = "F64", value = "4004000000000000" }] } }
javascript = { kind = "Exception", value = "Error: Unknown surrogate type: undefined" }

[[mismatch]]
id = "captured_tuple_with_option"
reason = "Tuples containing tagged surrogates also require recursive array hydration."
rust = { kind = "Return", value = { type = "Tuple", value = [{ type = "F64", value = "3ff0000000000000" }, { type = "Some", value = { type = "F64", value = "4000000000000000" } }] } }
javascript = { kind = "Exception", value = "Error: Unknown surrogate type: undefined" }

[[mismatch]]
id = "captured_nan"
reason = "A captured nonfinite float serializes as null and hydrates as unit."
rust = { kind = "Return", value = { type = "F64", value = "nan" } }
javascript = { kind = "Return", value = { type = "Unit" } }

[[mismatch]]
id = "captured_infinity"
reason = "A captured nonfinite float serializes as null and hydrates as unit."
rust = { kind = "Return", value = { type = "F64", value = "7ff0000000000000" } }
javascript = { kind = "Return", value = { type = "Unit" } }

[[mismatch]]
id = "some_unit"
reason = "The JavaScript option uses undefined for both None and a unit payload."
rust = { kind = "Return", value = { type = "Bool", value = true } }
javascript = { kind = "Return", value = { type = "Bool", value = false } }

[[mismatch]]
id = "return_inside_if"
reason = "The JavaScript return exits the conditional's generated function instead of the outer closure."
rust = { kind = "Return", value = { type = "F64", value = "3ff0000000000000" } }
javascript = { kind = "Return", value = { type = "F64", value = "4000000000000000" } }

[[mismatch]]
id = "break_inside_if"
reason = "The conditional's generated function separates break from its enclosing loop."
rust = { kind = "Return", value = { type = "F64", value = "4008000000000000" } }
javascript = { kind = "CompileError", value = "SyntaxError: Illegal break statement" }

[[mismatch]]
id = "continue_inside_if"
reason = "The conditional's generated function separates continue from its enclosing loop."
rust = { kind = "Return", value = { type = "F64", value = "4008000000000000" } }
javascript = { kind = "CompileError", value = "SyntaxError: Illegal continue statement: no surrounding iteration statement" }
