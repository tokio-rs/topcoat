[package]
name = "topcoat-mail"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:topcoat-router",
]
smtp = ["lettre/smtp-transport", "lettre/tokio1", "lettre/tokio1-rustls-tls", "lettre/pool"]

[dependencies]
topcoat-core.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-view.workspace = true

lettre = { workspace = true, features = ["builder", "hostname"] }
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
