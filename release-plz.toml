[workspace]
git_release_draft = true
pr_draft = true
pr_labels = ["release"]
release_always = true

# Default to NOT releasing. Each publishable crate opts in with `release = true`
# below. This is deliberate: release-plz's release-order pass runs over *all*
# workspace members (including the `publish = false` examples/benchmarks) and its
# topological sort trips over the facade<->sub-crate dependencies, reporting a
# spurious "circular dependency" error. Defaulting to `release = false` keeps the
# non-publishable crates out of that pass. Keep the opt-in list below in sync with
# the publishable members under `crates/`.
release = false

# One git tag and GitHub release per Topcoat version, not one per crate. Every
# crate shares the workspace version through the `topcoat` version group, so the
# facade crate alone opts back in below and tags plain `v{{ version }}`.
git_tag_enable = false
git_release_enable = false

[[package]]
name = "topcoat"
release = true
version_group = "topcoat"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
# The facade's changelog (and thus the release body) covers the whole
# workspace, not just commits touching `crates/topcoat`. Keep in sync with the
# other publishable members below.
changelog_include = [
    "topcoat-alpine-ajax",
    "topcoat-asset",
    "topcoat-cli",
    "topcoat-cookie",
    "topcoat-core",
    "topcoat-core-grammar",
    "topcoat-core-macro",
    "topcoat-datastar",
    "topcoat-font",
    "topcoat-font-grammar",
    "topcoat-font-macro",
    "topcoat-htmx",
    "topcoat-inertia",
    "topcoat-icon",
    "topcoat-icon-grammar",
    "topcoat-icon-macro",
    "topcoat-mail",
    "topcoat-mail-grammar",
    "topcoat-mail-macro",
    "topcoat-router",
    "topcoat-router-grammar",
    "topcoat-router-macro",
    "topcoat-runtime",
    "topcoat-runtime-grammar",
    "topcoat-runtime-macro",
    "topcoat-session",
    "topcoat-tailwind",
    "topcoat-ui",
    "topcoat-ui-registry",
    "topcoat-view",
    "topcoat-view-grammar",
    "topcoat-view-macro",
]

